name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0). Empty = default 0.1.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Tests first: they do not need link.exe, and msvc-dev-cmd would put
      # Platform=x64 in the environment, which the solution (Any CPU only) rejects.
      - name: Run tests
        run: dotnet test -c Release

      # Native AOT links with link.exe: the windows runner has the VS C++ tools,
      # this step exposes them (vcvars) before the publish.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = $env:VERSION
          if ([string]::IsNullOrWhiteSpace($version) -and "${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.1.0" }
          "Resolved version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # Platform=AnyCPU overrides the Platform=x64 left in the environment by
      # msvc-dev-cmd; the runtime identifier (win-x64) comes from the project.
      - name: Publish native executable
        run: dotnet publish src/Banog.csproj -c Release -p:Platform=AnyCPU -o publish/app -p:Version=${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        timeout-minutes: 10

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer\installer.iss `
            /DMyAppVersion=$version `
            /DMySourceDir=..\publish\app `
            /DMyOutputDir=..\artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifacts, portable-tmp | Out-Null
          Copy-Item publish\app\* portable-tmp\ -Recurse -Force
          Remove-Item portable-tmp\*.pdb -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path portable-tmp\* -DestinationPath artifacts\Banog-$version-portable.zip -Force
          Remove-Item portable-tmp -Recurse -Force

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts\* -File | Where-Object { $_.Extension -ne ".txt" } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content artifacts\SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts\SHA256SUMS.txt

      - name: Upload artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banog-release-files
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Banog v${{ steps.version.outputs.version }}
          files: |
            artifacts/Banog-setup-*.exe
            artifacts/Banog-*-portable.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
